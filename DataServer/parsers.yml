# parsers.yml — tell data-server how to read each log source.
#
# Each entry has a `match:` (path glob, container-side) plus EITHER a
# `format:` (built-in name, easy mode) or a `regex:` (custom pattern,
# advanced).
#
# Built-in formats:
#   demo-csv        — the synthetic generator that ships with this repo
#   sshd-auth       — Linux sshd "Failed password" lines (auth.log / secure)
#   sshd-auth-end   — sshd logins that failed without a password (key-only,
#                     invalid user); once per connection
#   sshd-scan       — sshd connections dropped before auth (scanners);
#                     once per connection
#   ufw             — UFW firewall BLOCK lines (TCP/UDP)
#   nginx-access    — nginx combined access log
#   apache-access   — Apache combined access log
#   caddy-json      — Caddy v2 JSON access log
#   fail2ban        — fail2ban "Ban <ip>" actions
#
# Entries are tried top-to-bottom; the first one whose match-glob fits
# the source path AND whose regex matches the line wins. Lines no entry
# matches are silently skipped.
#
# IMPORTANT: each `match:` glob must line up with a path in SYSLOG_PATHS.
# Real host logs are mounted under /host-logs/<name>/ (see
# docker-compose.override.example.yml), so the globs below use that prefix.
# A mismatch (e.g. /host-syslog/... vs /host-logs/...) silently drops every
# line. Set LOG_LEVEL=DEBUG to see per-line parse-miss / geo-miss reasons.
#
# Note: a source only produces events if its lines carry a *public* source
# IP. Logs like nginx error.log (worker notices, no client IP) can't be
# geolocated and should be left out of SYSLOG_PATHS entirely.

# Default: parse the synthetic generator's output.
- match: "/var/log/attack-map/syslog"
  format: demo-csv

# --- Real logs: uncomment + adjust the path to match your SYSLOG_PATHS ---
#
# sshd: every failed password attempt, plus one event for each connection
# that failed or was dropped some other way (no double counting).
- match: "/host-logs/system/auth.log"
  format: sshd-auth

- match: "/host-logs/system/auth.log"
  format: sshd-auth-end

- match: "/host-logs/system/auth.log"
  format: sshd-scan

- match: "/host-logs/system/ufw.log"
  format: ufw

# Only plot requests that got an error response (4xx/5xx) — scanners and
# probes — not ordinary visitors, and skip our own uptime monitor.
- match: "/host-logs/caddy/access.log"
  format: caddy-json
  exclude:
    - '"status":[123]\d\d\b'
    - 'Better Uptime Bot'

# - match: "/host-logs/nginx/access.log"
#   format: nginx-access
#
# - match: "/host-logs/apache/access.log"
#   format: apache-access
#
# - match: "/host-logs/fail2ban/fail2ban.log"
#   format: fail2ban
#
# --- Tweak defaults without writing a regex ---
#
# If a built-in format gets the fields almost right, override individual
# defaults under your entry. Note: regex captures always win — defaults
# only fill in fields the regex doesn't extract.
#
# - match: "/host-logs/nginx/https-access.log"
#   format: nginx-access
#   defaults:
#     dst_port: "443"
#
# --- Drop lines you don't want plotted ---
#
# `exclude:` takes a regex (or a list of them); any line matching one is
# skipped and counted as `excluded` in the pipeline tally, not `parse_miss`.
#
# - match: "/host-logs/nginx/access.log"
#   format: nginx-access
#   exclude: '" [23]\d\d '     # only 4xx/5xx responses
#
# --- Advanced: fully custom regex ---
#
# Only needed if none of the built-ins match. Use named groups for any of
# src_ip, dst_ip, src_port, dst_port, type_attack, cve_attack; supply the
# rest via `defaults:`.
#
# - match: "/host-logs/myapp/myapp.log"
#   regex: '... (?P<src_ip>\S+) ... (?P<src_port>\d+) ...'
#   defaults:
#     dst_ip: "0.0.0.0"
#     dst_port: "0"
#     type_attack: "custom"
#     cve_attack: "N/A"
