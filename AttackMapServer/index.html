<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cybermap — live attack map</title>

        <script src="https://d3js.org/d3.v3.min.js" charset="utf-8"></script>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <link href="/static/index.css" rel="stylesheet"/>

        <script>
            window.MAPBOX_TOKEN = {% raw json_encode(mapbox_token) %};
            window.HQ_LAT_LNG = [{{ hq_lat }}, {{ hq_lng }}];
            window.SERVICE_RGB = {% raw json_encode(service_rgb) %};
        </script>
    </head>

    <body>
        <div id="map"></div>
        <div id="overlay"></div>

        <script src="/static/map.js"></script>
        <script type="module" src="/static/overlay.js"></script>
    </body>

</html>
