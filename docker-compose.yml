name: cybermap

# Cap container stdout/stderr logs — the default json-file driver is unbounded.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # Pure pub/sub broker: nothing is persisted, so snapshots/AOF are disabled
  # and no data volume is needed.
  redis:
    container_name: cm-redis
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - default

  # One-shot init: downloads GeoLite2-City.mmdb into the shared geoip volume.
  # Skips the download if the DB is already present and < GEOIP_MAX_AGE_DAYS old.
  geoip-init:
    container_name: cm-geoip-init
    image: alpine:3.20
    environment:
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      GEOIP_DB_PATH: /geoip/GeoLite2-City.mmdb
      GEOIP_MAX_AGE_DAYS: ${GEOIP_MAX_AGE_DAYS:-14}
    volumes:
      - geoip-db:/geoip
      - ./scripts/download-geoip.sh:/download-geoip.sh:ro
    command: sh /download-geoip.sh
    restart: on-failure
    logging: *default-logging

  # Generates synthetic attack events and writes them to the shared syslog volume.
  # Container is always created; set SYSLOG_GEN_ENABLED=false in .env to keep it stopped.
  # To feed real host logs, add per-source volume mounts in a
  # docker-compose.override.yml (see docker-compose.override.example.yml).
  syslog-gen:
    container_name: cm-syslog-gen
    build: .
    command: ["sh", "-c", "if [ \"$$SYSLOG_GEN_ENABLED\" = \"true\" ]; then exec python DataServer/syslog-gen.py; else echo '[syslog-gen] disabled via SYSLOG_GEN_ENABLED=false'; fi"]
    environment:
      SYSLOG_GEN_ENABLED: ${SYSLOG_GEN_ENABLED:-true}
      SYSLOG_PATH: /var/log/attack-map/syslog
      HQ_IP: ${HQ_IP:-8.8.8.8}
      EVENT_RATE: ${EVENT_RATE:-5}
      SYSLOG_MAX_BYTES: ${SYSLOG_MAX_BYTES:-10485760}
    volumes:
      - syslog-feed:/var/log/attack-map
    networks:
      - default
    restart: on-failure
    mem_limit: 128m
    logging: *default-logging

  data-server:
    container_name: cm-data-feed
    build: .
    command: python DataServer/DataServer.py
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SYSLOG_PATH: ${SYSLOG_PATH:-/var/log/attack-map/syslog}
      SYSLOG_PATHS: ${SYSLOG_PATHS:-}
      PARSERS_PATH: /etc/cybermap/parsers.yml
      GEOIP_DB_PATH: /geoip/GeoLite2-City.mmdb
      HQ_IP: ${HQ_IP:-8.8.8.8}
      IGNORE_SRC_IPS: ${IGNORE_SRC_IPS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_TRACKED_IPS: ${MAX_TRACKED_IPS:-10000}
      STATS_PUBLISH_INTERVAL: ${STATS_PUBLISH_INTERVAL:-1}
    volumes:
      - syslog-feed:/var/log/attack-map
      - geoip-db:/geoip:ro
      - ${HOST_PARSERS_PATH:-./DataServer/parsers.yml}:/etc/cybermap/parsers.yml:ro
      # Real host log sources are added here via docker-compose.override.yml —
      # one read-only *directory* mount per source. See
      # docker-compose.override.example.yml for the pattern.
    depends_on:
      - redis
      - geoip-init
    networks:
      - default
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging

  attack-map-server:
    container_name: cm-attack-map
    build: .
    command: python AttackMapServer/AttackMapServer.py
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8888
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
      HQ_LAT: ${HQ_LAT:-52.354551}
      HQ_LNG: ${HQ_LNG:-4.7391558}
    depends_on:
      - redis
    expose:
      - 8888
    networks:
      - default
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:

volumes:
  geoip-db:
  syslog-feed:
